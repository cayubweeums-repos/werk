version: "3"
services:
  werk:
    container_name: werk_web
    environment:
      TZ: "America/Chicago"
      ADMIN_NAME: "admin"
      ADMIN_PASS: "changeme"
      HOST_IP: "192.168.2.163"
    build:
      context: .
    ports:
      - 5554:5554
    volumes: 
      - ./data:/data:z
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5554
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  database:
    container_name: werk_mongodb
    image: mongo
    restart: always
    volumes:
      - ./data/db:/data/db:z
    ports:
      - 27017:27017
    environment:
      TZ: "America/Chicago"
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example

  database-web:
    container_name: werk_mongodb_web
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      TZ: "America/Chicago"
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://root:example@database:27017/